[package]
name = "lz4rip-bench-app"
description = "Stand-in for an application's library crate in lz4rip benchmarks."
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
lz4rip = { path = "../..", default-features = false, features = ["std"] }

[dependencies.lz4_flex_upstream]
git = "https://github.com/PSeitz/lz4_flex"
package = "lz4_flex"

[dependencies.lz4_flex_unsafe]
version = "0.11.5"
package = "lz4_flex"
default-features = false
features = ["std"]
