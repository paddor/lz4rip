[package]
name = "lz4rip-core"
description = "Shared types and constants for lz4rip encode/decode crates."
version = "0.6.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/paddor/lz4rip"
readme = "README.md"

[features]
default = ["std"]
std = []
nightly = []
# No effect today: every build is safe Rust. Kept so existing feature lists
# build, and to keep any future `unsafe` out of builds that enable it.
paranoid = []

[dev-dependencies]
proptest = "1.0.0"
