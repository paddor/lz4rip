[workspace]

[package]
name = "lz4rip-wasm"
version = "0.2.9"
edition = "2024"
description = "WebAssembly bindings for lz4rip"
repository = "https://github.com/paddor/lz4rip"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lz4rip = { path = "../..", default-features = false, features = ["frame"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
